<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>__DECOY_TITLE__</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem;
    }
    .card {
      max-width: 520px; width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
      padding: 2.5rem; backdrop-filter: blur(8px);
    }
    h1 { font-size: 1.75rem; margin-bottom: .75rem; font-weight: 600; }
    p { line-height: 1.6; color: #94a3b8; margin-bottom: 1rem; }
    .status { display: inline-flex; align-items: center; gap: .5rem;
      font-size: .875rem; color: #34d399; margin-top: 1rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399;
      animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    footer { margin-top: 2rem; font-size: .75rem; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>__DECOY_TITLE__</h1>
    <p>This endpoint serves static content. If you reached this page unexpectedly, check your network configuration.</p>
    <div class="status"><span class="dot"></span> Service operational</div>
    <footer>stanlley-locke/vpn_script</footer>
  </main>
</body>
</html>
