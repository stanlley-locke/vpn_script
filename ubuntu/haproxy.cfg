# HAProxy — stanlley-locke/vpn_script
# Placeholder xxx = primary domain (replaced at install)

global
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d
    tune.h2.initial-window-size 2147483647
    tune.ssl.default-dh-param 2048
    pidfile /run/haproxy.pid
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client  3600s
    timeout server  3600s

# Port multiplexing (222–1000) for alternate entry
frontend multiport
    mode tcp
    bind *:222-1000 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend recir_http if HTTP
    default_backend recir_https

frontend multiports
    mode tcp
    bind abns@haproxy-http accept-proxy tfo
    default_backend recir_https_www

# Primary TLS front-end — Cloudflare → VPS :443
frontend ssl
    mode tcp
    bind *:443 tfo
    bind *:80 tfo
    bind *:8880 tfo
    bind *:8080 tfo
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    tcp-request inspect-delay 500ms
    tcp-request content capture req.ssl_sni len 128
    tcp-request content accept if { req.ssl_hello_type 1 }

    # SNI: only accept configured domain (+ optional www)
    acl sni_valid req.ssl_sni -i xxx
    acl sni_valid req.ssl_sni -i www.xxx
    tcp-request content reject if !sni_valid { req.ssl_hello_type 1 }

    acl is_h2 ssl_fc_alpn -i h2
    acl is_ws hdr(Connection) -i upgrade
    acl is_ws hdr(Upgrade) -i websocket
    acl is_ss payload(0,7) -m bin 5353482d322e30

    use_backend backend_grpc if is_h2
    use_backend backend_ws if is_ws
    use_backend backend_ws if { path_reg -i ^\/(.*) }
    use_backend backend_shadowsocks if is_ss
    default_backend backend_openvpn

backend backend_ws
    mode http
    option forwardfor
    server nginx_ws 127.0.0.1:1010 send-proxy check inter 5s rise 2 fall 3

backend backend_grpc
    mode tcp
    server nginx_grpc 127.0.0.1:1013 send-proxy check inter 5s rise 2 fall 3

backend backend_openvpn
    mode tcp
    balance roundrobin
    server openvpn 127.0.0.1:1194 check inter 10s
    server ovpn_ws 127.0.0.1:1012 send-proxy check inter 5s

backend backend_shadowsocks
    mode tcp
    server ss_legacy 127.0.0.1:2222 check

backend recir_https_www
    mode tcp
    server loop 127.0.0.1:2223 check

backend recir_http
    mode tcp
    server loopback-for-http abns@haproxy-http send-proxy-v2 check

backend recir_https
    mode tcp
    server loopback-for-https abns@haproxy-https send-proxy-v2 check
