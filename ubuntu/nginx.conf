user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cf=$http_cf_connecting_ip';

    access_log /var/log/nginx/access.log main;

    # Local HAProxy PROXY protocol
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # Cloudflare real client IP (managed by cf-setup / cf_sync_ips_to_nginx)
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    include /etc/nginx/conf.d/xray.conf;
    include /etc/nginx/conf.d/decoy.conf;
    include /etc/nginx/conf.d/subscription.conf;
}
