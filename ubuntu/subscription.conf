# Subscription endpoint — stanlley-locke/vpn_script
# Proxies /sub/<token> to local subscription server

server {
    listen 127.0.0.1:8098;
    server_name _;
    location ~ ^/sub/([A-Za-z0-9_-]+)/?$ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        add_header Profile-Update-Interval "24" always;
        add_header Content-Disposition "attachment; filename=subscription.txt" always;
    }
}
